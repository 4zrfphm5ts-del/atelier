<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171311" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Vignolo</title>
<meta name="description" content="Vignolo — la cave du restaurant qui sait où elle en est : inventaire des bouteilles, familles d'accords mets et vins, tâches du jour et analyse d'un plat pour trouver l'accord le plus juste. Local, sans compte.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vignolo">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23F6F1E9'/%3E%3Cpath d='M26 8h12v10c0 4 7 8 7 16v18a4 4 0 0 1-4 4H23a4 4 0 0 1-4-4V34c0-8 7-12 7-16z' fill='%237B1E3C'/%3E%3Cpath d='M22 40h20v12a2 2 0 0 1-2 2H24a2 2 0 0 1-2-2z' fill='%23B98A3C'/%3E%3C/svg%3E">
<style>
/* ================= VIGNOLO — la cave qui sait où elle en est =================
   Papier crème et encre chaude en salle, cave sombre en mode nuit.
   Serif seulement pour les titres (émotion), sans pour les chiffres et l'usage. */
:root{
  --bg:#F6F1E9; --surface:#FFFDF9; --surface-2:#F1EAE0; --surface-3:#EADFD0;
  --line:#E3DACB; --line-2:#D2C6B4;
  --ink:#231C19; --ink-2:#6B5F58; --ink-3:#9A8F86;
  --wine:#7B1E3C; --wine-2:#9E2E52; --wine-soft:#F3DDE4; --wine-ink:#FFF7FA;
  --gold:#B98A3C; --gold-soft:#F2E5C8;
  --good:#2E7D4F; --good-soft:#DDEFE3; --warn:#B8770F; --warn-soft:#F7E9C8; --bad:#C2403A; --bad-soft:#F8DCD9;
  --c-rouge:#7B1E3C; --c-blanc:#CDB84A; --c-rose:#E39AA9; --c-bulles:#C9A84C; --c-doux:#C9792C;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --r:16px; --r-s:10px; --shadow:0 1px 2px rgba(35,28,25,.06),0 8px 24px -12px rgba(35,28,25,.18);
  --tab-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171311; --surface:#211B18; --surface-2:#2A2320; --surface-3:#342B27;
    --line:#3A302B; --line-2:#4A3E38;
    --ink:#F1EAE2; --ink-2:#BDB0A6; --ink-3:#8A7D74;
    --wine:#C9527A; --wine-2:#DC6A90; --wine-soft:#3D2230; --wine-ink:#1A0F14;
    --gold:#D7A64C; --gold-soft:#3B3020;
    --good:#5BBF86; --good-soft:#1E3A2A; --warn:#E0A63A; --warn-soft:#3E3217; --bad:#E36A63; --bad-soft:#44221F;
    --c-rouge:#C9527A; --c-blanc:#D9C65C; --c-rose:#EBA7B5; --c-bulles:#D7B45A; --c-doux:#DB8C3C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171311; --surface:#211B18; --surface-2:#2A2320; --surface-3:#342B27;
  --line:#3A302B; --line-2:#4A3E38;
  --ink:#F1EAE2; --ink-2:#BDB0A6; --ink-3:#8A7D74;
  --wine:#C9527A; --wine-2:#DC6A90; --wine-soft:#3D2230; --wine-ink:#1A0F14;
  --gold:#D7A64C; --gold-soft:#3B3020;
  --good:#5BBF86; --good-soft:#1E3A2A; --warn:#E0A63A; --warn-soft:#3E3217; --bad:#E36A63; --bad-soft:#44221F;
  --c-rouge:#C9527A; --c-blanc:#D9C65C; --c-rose:#EBA7B5; --c-bulles:#D7B45A; --c-doux:#DB8C3C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:var(--wine)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--ink-2)}
.tiny{font-size:12px;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Coque : en-tête, vues, barre d'onglets ---------- */
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);padding:calc(10px + var(--safe-t)) 16px 10px;border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none}
.brand b{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:.01em}
.brand small{display:block;font-size:11px;color:var(--ink-3);margin-top:-3px;white-space:nowrap}
.who{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.who .av{width:22px;height:22px;border-radius:50%;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;font-size:11px;font-weight:700}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:16px 16px calc(var(--tab-h) + var(--safe-b) + 24px)}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabbar-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:11px;font-weight:600;letter-spacing:.02em;position:relative;transition:color .15s}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--wine)}
.tab.on::after{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--wine)}
.tab .dot{position:absolute;top:10px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center;font-weight:700}
@media (min-width:900px){
  .tabbar{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);order:-1}
  .tabbar-in{height:52px}
  .tab{flex-direction:row;gap:8px;font-size:13px}
  .tab.on::after{top:auto;bottom:0;border-radius:3px 3px 0 0}
  .tab .dot{top:8px;right:calc(50% - 56px)}
  main{padding-bottom:40px}
}

/* ---------- Blocs ---------- */
.section{margin:0 0 22px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 10px;padding:0 2px}
.section-h h2{font-family:var(--serif);font-weight:500;font-size:20px}
.section-h .link{font-size:13px;font-weight:600;color:var(--wine)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.card + .card{margin-top:10px}
.card.flat{box-shadow:none}
.card.wine{background:linear-gradient(135deg,var(--wine) 0%,#5A1530 100%);color:#FFF7FA;border-color:transparent}
:root[data-theme="dark"] .card.wine{background:linear-gradient(135deg,#6E1E3C 0%,#3D1222 100%)}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:380px){.grid-3{grid-template-columns:1fr 1fr}}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Tuiles de chiffres (stat tiles) ---------- */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.tile .lbl{font-size:12px;color:var(--ink-2);font-weight:500}
.tile .val{font-size:26px;font-weight:650;line-height:1.15;margin-top:2px;letter-spacing:-.02em}
.tile .sub{font-size:12px;color:var(--ink-3);margin-top:2px}
.tile.alert .val{color:var(--bad)}
.hero-num{font-size:48px;font-weight:650;line-height:1;letter-spacing:-.03em}

/* ---------- Anneau de progression ---------- */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .track{stroke:var(--wine-soft)}
.ring .fill{stroke:var(--wine);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .ctr b{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1}
.ring .ctr span{font-size:11px;color:var(--ink-2);margin-top:3px}
.ring.done .fill{stroke:var(--good)}
.ring.done .track{stroke:var(--good-soft)}

/* ---------- Boutons, puces, champs ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--surface-2);color:var(--ink);font-weight:600;font-size:15px;border:1px solid var(--line);transition:transform .08s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--wine);color:var(--wine-ink);border-color:transparent}
.btn.primary:hover{background:var(--wine-2)}
.btn.gold{background:var(--gold);color:#1F1708;border-color:transparent}
.btn.ghost{background:transparent;border-color:var(--line-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.xs{min-height:30px;padding:0 10px;font-size:12px;border-radius:8px}
.btn.block{width:100%}
.btn.icon{width:44px;padding:0}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--wine);color:var(--wine-ink);border-color:transparent}
.chip .sw{width:10px;height:10px;border-radius:50%;flex:none}
.chip.sm{height:24px;padding:0 8px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.field{display:grid;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--ink-2)}
.input,select.input,textarea.input{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line-2);outline:none;transition:border .15s,box-shadow .15s}
.input:focus{border-color:var(--wine);box-shadow:0 0 0 3px var(--wine-soft)}
textarea.input{min-height:88px;resize:vertical;line-height:1.4}
select.input{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.search{position:relative}
.search .input{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink-3);fill:none;stroke-width:2;stroke-linecap:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:36px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.sw-t{width:48px;height:28px;border-radius:14px;background:var(--line-2);position:relative;flex:none;transition:background .2s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw-t.on{background:var(--good)}
.sw-t.on::after{transform:translateX(20px)}

/* ---------- Pas-à-pas (stepper) ---------- */
.stepper{display:inline-flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{width:44px;height:44px;font-size:22px;font-weight:500;color:var(--ink);display:grid;place-items:center}
.stepper button:active{background:var(--surface-3)}
.stepper .v{min-width:52px;text-align:center;font-size:20px;font-weight:650;letter-spacing:-.02em}
.stepper.big button{width:64px;height:64px;font-size:30px}
.stepper.big .v{min-width:96px;font-size:44px}
.stepper .v.pop{animation:pop .25s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- Bouteilles (cartes de la cave) ---------- */
.bottle{display:grid;grid-template-columns:6px 1fr auto;gap:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 12px 12px;box-shadow:var(--shadow);align-items:center;position:relative}
.bottle .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--c-rouge)}
.bottle .bar.blanc{background:var(--c-blanc)}.bottle .bar.rose{background:var(--c-rose)}.bottle .bar.bulles{background:var(--c-bulles)}.bottle .bar.doux{background:var(--c-doux)}
.bottle .nm{font-weight:650;font-size:15px;line-height:1.25}
.bottle .meta{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.bottle .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.bottle .tags .chip{height:22px;padding:0 8px;font-size:11px}
.bottle .stock{text-align:right;min-width:62px}
.bottle .stock b{display:block;font-size:30px;font-weight:650;line-height:1;letter-spacing:-.03em}
.bottle .stock b.pop{animation:pop .25s ease}
.bottle .stock span{font-size:11px;color:var(--ink-3)}
.bottle .meter{grid-column:2/4;margin-top:9px;height:6px;border-radius:3px;background:var(--wine-soft);overflow:hidden}
.bottle .meter i{display:block;height:100%;border-radius:3px;background:var(--wine);transition:width .4s}
.bottle .meter.warn{background:var(--warn-soft)}.bottle .meter.warn i{background:var(--warn)}
.bottle .meter.bad{background:var(--bad-soft)}.bottle .meter.bad i{background:var(--bad)}
.bottle .meter.good{background:var(--good-soft)}.bottle .meter.good i{background:var(--good)}
.bottle .acts{grid-column:2/4;display:flex;gap:6px;margin-top:10px}
.bottle .acts .btn{flex:1;min-height:36px;padding:0 6px;font-size:12.5px}
.bottle.counted::before{content:"✓";position:absolute;top:10px;right:12px;width:18px;height:18px;border-radius:50%;background:var(--good);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.bottle.counted .stock{padding-top:12px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:0 8px;height:22px;border-radius:999px}
.st.bad{background:var(--bad-soft);color:var(--bad)}.st.warn{background:var(--warn-soft);color:var(--warn)}.st.good{background:var(--good-soft);color:var(--good)}.st.neutral{background:var(--surface-2);color:var(--ink-2)}
.st svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Tâches, journal, badges ---------- */
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.task + .task{margin-top:8px}
.task .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);flex:none;margin-top:1px;display:grid;place-items:center;transition:all .15s}
.task .ck svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .ck{background:var(--good);border-color:var(--good)}
.task.done .ck svg{opacity:1}
.task.done .t{text-decoration:line-through;color:var(--ink-3)}
.task .t{font-weight:600;font-size:14.5px;line-height:1.3}
.task .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.task .pri{width:8px;height:8px;border-radius:50%;flex:none;margin-top:9px}
.task .pri.bad{background:var(--bad)}.task .pri.warn{background:var(--warn)}.task .pri.ok{background:var(--line-2)}
.jl{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.jl:last-child{border-bottom:0}
.jl time{flex:none;width:46px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12.5px}
.jl .q{flex:none;min-width:34px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.jl .q.minus{color:var(--bad)}.jl .q.plus{color:var(--good)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-3)}
.badge .ic{width:28px;height:28px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:14px;filter:grayscale(1);opacity:.5}
.badge.won{color:var(--ink);background:var(--gold-soft);border-color:transparent}
.badge.won .ic{background:var(--gold);filter:none;opacity:1}
.streak{display:flex;align-items:center;gap:10px}
.streak b{font-size:22px;font-weight:650}

/* ---------- Accords ---------- */
.fam{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.fam .sw{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;color:#fff;font-weight:700;font-family:var(--serif)}
.sw.rouge{background:var(--c-rouge)}.sw.blanc{background:var(--c-blanc);color:#2E2A14}.sw.rose{background:var(--c-rose);color:#4A1F28}.sw.bulles{background:var(--c-bulles);color:#2E2410}.sw.doux{background:var(--c-doux)}
.score{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;margin-top:6px}
.score .trk{height:10px;border-radius:0 4px 4px 0;background:var(--surface-3);overflow:hidden}
.score .trk i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--wine);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.score .pct{font-size:12.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
.pick{display:grid;grid-template-columns:6px 1fr auto;gap:0 10px;align-items:center;padding:10px 12px 10px 10px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.pick + .pick{margin-top:6px}
.pick .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--c-rouge)}
.pick .bar.blanc{background:var(--c-blanc)}.pick .bar.rose{background:var(--c-rose)}.pick .bar.bulles{background:var(--c-bulles)}.pick .bar.doux{background:var(--c-doux)}
.pick .nm{font-weight:650;font-size:14.5px}
.pick .why{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.pick .q{font-weight:700;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.pick .q small{display:block;font-size:10.5px;color:var(--ink-3);font-weight:600}
.pick.best{border-color:var(--gold);background:var(--gold-soft)}
.alim{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.alim .k{color:var(--ink-3);font-weight:500}
.alim.main{border-color:var(--wine);color:var(--wine)}
.course{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.course .n{width:28px;height:28px;border-radius:50%;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.course h3{font-family:var(--serif);font-weight:500;font-size:19px}
.course .line{flex:1;height:1px;background:var(--line)}
.dropzone{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink-2);background:var(--surface)}
.dropzone.hot{border-color:var(--wine);background:var(--wine-soft)}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:12px;display:block}
.scan-anim{position:relative;overflow:hidden;border-radius:12px}
.scan-anim::after{content:"";position:absolute;left:0;right:0;top:-40%;height:40%;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.55),transparent);animation:scan 1.6s linear infinite}
@keyframes scan{to{top:120%}}
.plan-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center}

/* ---------- Feuilles (sheets), dialogues, toasts, confettis ---------- */
.veil{position:fixed;inset:0;z-index:40;background:rgba(20,12,10,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.on{transform:none}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line-2);margin:10px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 18px 10px;flex:none}
.sheet .sh h2{font-family:var(--serif);font-weight:500;font-size:22px}
.sheet .sb{overflow:auto;padding:4px 18px calc(18px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sheet .sf{flex:none;padding:10px 18px calc(12px + var(--safe-b));border-top:1px solid var(--line);background:var(--bg);display:flex;gap:8px}
@media (min-width:700px){.sheet{left:50%;right:auto;width:640px;transform:translate(-50%,102%)}.sheet.on{transform:translate(-50%,0)}}
.x{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--safe-b) + 14px);transform:translate(-50%,20px);z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{bottom:28px}}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:13.5px}
.banner .btn{flex:none}
.empty{text-align:center;padding:28px 16px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;color:var(--ink);margin-bottom:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:600}
details.help{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface)}
details.help summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between}
details.help summary::after{content:"+";color:var(--ink-3)}
details.help[open] summary::after{content:"−"}
details.help .body{padding:0 0 14px;font-size:13.5px;color:var(--ink-2);line-height:1.5}
.fab{position:fixed;right:16px;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);z-index:25;width:56px;height:56px;border-radius:18px;background:var(--wine);color:var(--wine-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(123,30,60,.6)}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
@media (min-width:900px){.fab{bottom:28px;right:calc(50% - 380px + 16px)}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* ---------- 6. Outils de texte ---------- */
const norm = s => (s || "").toString().toLowerCase().replace(/œ/g, "oe").replace(/æ/g, "ae")
  .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[''`\-_/,;:()!?.]/g, " ").replace(/\s+/g, " ").trim();
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const LEX = LEXIQUE_TXT.split("\n").map(l => l.trim()).filter(Boolean).map(l => {
  const [p, t, n] = l.split("|").map(x => x.trim());
  const exact = p.endsWith("!"); const pat = exact ? p.slice(0, -1) : p;
  return {pat, exact, tags: t.split(/\s+/).filter(Boolean), nom: n || pat,
    re: new RegExp("(^|[^a-z])(" + escRe(pat) + ")" + (exact ? "(?![a-z])" : "[a-z]*"), "g")};
}).sort((a, b) => b.pat.length - a.pat.length);

/* Repère les aliments d'une description. Le motif le plus long consomme ses mots,
   puis les plus courts passent sur ce qui reste : « crème brûlée » ne donne jamais
   l'étiquette « crème (sauce) ». */
function detecterAliments(texte) {
  let t = " " + norm(texte) + " ";
  const aliments = []; const tags = {};
  for (const e of LEX) {
    if (!e.re.test(t)) { e.re.lastIndex = 0; continue; }
    e.re.lastIndex = 0;
    t = t.replace(e.re, (m, pre) => pre + " ".repeat(m.length - pre.length));
    aliments.push({nom: e.nom, tags: e.tags});
    e.tags.forEach(k => { tags[k] = (tags[k] || 0) + 1; });
  }
  return {aliments, tags: Object.keys(tags), reste: t.trim()};
}

const TAGS_DESSERT = ["chocolat", "fruits_rouges", "fruits_jaunes", "agrumes", "caramel", "cremeux", "patisserie", "fruits_exotiques", "glace"];
const TAGS_FROMAGE = ["fromage_frais", "fromage_chevre", "fromage_molle", "fromage_dure", "fromage_bleu", "fromage_lave"];
const TAGS_LOURDS = ["viande_rouge", "viande_blanche", "volaille", "canard", "agneau", "porc", "gibier", "poisson_maigre", "poisson_gras", "crustace", "abats"];
const TAGS_ENTREE = ["huitre", "charcuterie", "oeuf", "foie_gras", "poisson_cru", "legumes", "coquillage", "fromage_chevre", "fromage_frais"];

/* Devine le temps du repas quand il n'est pas donné. */
function devinerTemps(tags, texte) {
  const t = norm(texte || "");
  if (/\b(amuse bouche|aperitif|apero|tapas|mise en bouche|gougere|olives)\b/.test(t)) return "aperitif";
  if (/\bdessert\b/.test(t)) return "dessert";
  if (/\bentree\b/.test(t)) return "entree";
  const has = k => tags.includes(k);
  const viandes = ["viande_rouge", "viande_blanche", "volaille", "canard", "agneau", "porc", "gibier"];
  if (has("poisson_cru") && !viandes.some(has)) return "entree";
  const sale = ["tomate", "legumes", "creme", "charcuterie", "oeuf", "champignon", "poisson_maigre", "poisson_gras", "crustace", "coquillage"].concat(TAGS_FROMAGE, TAGS_LOURDS);
  const sucre = TAGS_DESSERT.filter(k => k !== "patisserie");
  if (sucre.some(has) && !TAGS_LOURDS.some(has)) return "dessert";
  if (has("patisserie") && !sale.some(has)) return "dessert";
  if (TAGS_FROMAGE.some(has) && !TAGS_LOURDS.some(has) && !TAGS_ENTREE.slice(0, 7).some(has) && !has("creme") && !has("tomate")) return "fromage";
  if (TAGS_ENTREE.some(has) && !TAGS_LOURDS.some(has)) return "entree";
  return "plat";
}

/* ---------- 7. Le score : moyenne pondérée des règles + a priori du service ---------- */
const toPct = s => Math.round(Math.max(0, Math.min(100, (s + 3) / 6 * 100)));
function scoreFamilles(tags, temps) {
  tags = (tags || []).filter(k => TAGS[k]);
  const s = {}, contrib = {}; let W = 0;
  FAM_KEYS.forEach(k => { s[k] = 0; contrib[k] = []; });
  for (const tag of tags) {
    const w = TAGS[tag].w; W += w; const r = R[tag] || {};
    FAM_KEYS.forEach(k => { const v = w * (r[k] || 0); s[k] += v; if (v) contrib[k].push({tag, v}); });
  }
  const pri = PRIOR[temps] || {};
  return FAM_KEYS.map(k => {
    const base = W ? s[k] / W : 0;
    const sc = base + (pri[k] || 0) * (W ? 1 : 1.5);
    const c = contrib[k].sort((a, b) => b.v - a.v);

  if (!s.meta || !s.meta.demo || s.meta.demoVersion === DEMO_VERSION) return;

  const perso = s.refs.filter(r => !r.demo && new Date(r.createdAt || 0).getTime() - t0 > 60000);

}

function confetti() {
  const cv = $("#confetti"); cv.classList.remove("hidden"); const ctx = cv.getContext("2d");
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.scale(devicePixelRatio, devicePixelRatio);
  const cols = ["#7B1E3C", "#B98A3C", "#E39AA9", "#CDB84A", "#2E7D4F"]; const P = [];
  for (let i = 0; i < 120; i++) P.push({x: innerWidth / 2 + (Math.random() - .5) * 120, y: innerHeight * .45, vx: (Math.random() - .5) * 14, vy: -Math.random() * 14 - 4, r: 4 + Math.random() * 5, c: cols[i % cols.length], a: Math.random() * 6, s: (Math.random() - .5) * .3});
  const t0 = performance.now();
  (function f(t) { const dt = (t - t0) / 1000; ctx.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.a += p.s; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.globalAlpha = Math.max(0, 1 - dt / 1.8); ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); }
    if (dt < 1.9) requestAnimationFrame(f); else { ctx.clearRect(0, 0, innerWidth, innerHeight); cv.classList.add("hidden"); } })(t0);
}

/* ---------- Cave ---------- */
const F = {q: "", couleur: "", zone: "", only: ""};
function refsFiltrees() {
  const q = VIG.norm(F.q);
  return refsActives().filter(r => (!F.couleur || r.couleur === F.couleur) && (!F.zone || r.zone === F.zone)
    && (F.only !== "acompter" || aCompter(r)) && (F.only !== "alerte" || ["bad", "warn"].includes(statut(r).cls))
    && (!q || VIG.norm([r.nom, r.domaine, r.appellation, r.region, r.millesime, VIG.FAM[r.famille] && VIG.FAM[r.famille].nom].join(" ")).includes(q)))
    .sort((a, b) => (VIG.ZONES.findIndex(z => z[0] === a.zone) - VIG.ZONES.findIndex(z => z[0] === b.zone)) || VIG.norm(a.nom).localeCompare(VIG.norm(b.nom)));
}
function meterCls(r) { const s = statut(r).cls; return s === "neutral" ? "" : s; }
function meterPct(r) { const st = Number(r.stock) || 0, cible = Number(r.cible) || 0, par = Number(r.par) || 0; const ref = cible || (par ? par * 2 : 6); return Math.max(0, Math.min(100, Math.round(st / ref * 100))); }
function bottleCard(r) {
  return `<div class="bottle ${compteAujourdhui(r) ? "counted" : ""}" data-id="${r.id}"><div class="bar ${h(r.couleur)}"></div>
    <div class="grow" data-action="ref-open" data-id="${r.id}"><div class="nm">${h(r.nom)}</div><div class="meta">${h(refSub(r)) || "&nbsp;"}</div><div class="tags">${famChip(r)}${zoneChip(r)}${stChip(r)}</div></div>
    <div class="stock" data-action="ref-open" data-id="${r.id}"><b>${Number(r.stock) || 0}</b><span>${r.cible ? `cible ${r.cible}` : "en stock"}</span></div>
    <div class="meter ${meterCls(r)}"><i style="width:${meterPct(r)}%"></i></div>
    <div class="acts"><button class="btn" data-action="mvt" data-id="${r.id}" data-type="vente" data-qty="-1">− 1 vente</button><button class="btn" data-action="mvt" data-id="${r.id}" data-type="livraison" data-qty="1">+ 1 reçue</button><button class="btn" data-action="count-one" data-id="${r.id}">Compter</button><button class="btn" data-action="ref-open" data-id="${r.id}" aria-label="Plus">⋯</button></div></div>`;
}
function renderCave() {
  const L = refsFiltrees(); const total = refsActives().length; const nbC = refsActives().filter(aCompter).length, nbA = refsActives().filter(r => ["bad", "warn"].includes(statut(r).cls)).length;
  let H = `<div class="section"><div class="search"><svg><use href="#i-search"/></svg><input class="input" id="q" placeholder="Chercher une bouteille, une appellation, une famille" value="${h(F.q)}" autocomplete="off"></div>
    <div class="chips scroll" style="margin-top:10px">${[["", "Toutes"]].concat(Object.entries(VIG.COULEURS)).map(([k, v]) => `<button class="chip ${F.couleur === k ? "on" : ""}" data-action="filt" data-f="couleur" data-v="${k}">${k ? `<i class="sw" style="background:var(--c-${k})"></i>` : ""}${v}</button>`).join("")}</div>
    <div class="chips scroll">${[["", "Partout"]].concat(VIG.ZONES).map(([k, v]) => `<button class="chip ${F.zone === k ? "on" : ""}" data-action="filt" data-f="zone" data-v="${k}">${v}</button>`).join("")}<button class="chip ${F.only === "acompter" ? "on" : ""}" data-action="filt" data-f="only" data-v="acompter">À compter · ${nbC}</button><button class="chip ${F.only === "alerte" ? "on" : ""}" data-action="filt" data-f="only" data-v="alerte">Alertes · ${nbA}</button></div></div>`;
  H += `<div class="row between section" style="margin-bottom:10px"><span class="tiny">${L.length === total ? plur(total, "référence") : `${L.length} sur ${total}`} · ${plur(L.reduce((s, r) => s + (Number(r.stock) || 0), 0), "bouteille")}</span><div class="row"><button class="btn xs ghost" data-action="count-start" ${nbC ? "" : "disabled"}>Mode comptage</button><button class="btn xs ghost" data-action="import-csv">Importer un CSV</button></div></div>`;

  else { let z = null; for (const r of L) { if (!F.zone && r.zone !== z) { z = r.zone; H += `<div class="section-h" style="margin-top:14px"><h2 style="font-size:17px">${h(VIG.ZONES_NOM[z] || "Sans zone")}</h2><span class="tiny">${plur(L.filter(x => x.zone === z).length, "référence")}</span></div>`; } H += bottleCard(r) + `<div style="height:8px"></div>`; } }
  $("#view-cave").innerHTML = H;
}

/* ---------- Mode comptage : une bouteille à la fois ---------- */
let CPT = null;
function ouvrirComptage(zone, ids) {
  let file = ids ? ids.map(refById).filter(Boolean) : refsActives().filter(r => aCompter(r) && (!zone || r.zone === zone));
  file.sort((a, b) => (VIG.ZONES.findIndex(z => z[0] === a.zone) - VIG.ZONES.findIndex(z => z[0] === b.zone)) || VIG.norm(a.nom).localeCompare(VIG.norm(b.nom)));
  if (!file.length) { toast("Rien à compter pour le moment"); return; }
  CPT = {file, i: 0, val: 0, faits: 0}; renderComptage();
}

function parsePlats(txt) {
  return txt.split(/\n|;|\bpuis\b/i).map(l => l.trim()).filter(Boolean).map(l => {
    let temps = null; const m = l.match(/^(ap[ée]ritif|ap[ée]ro|entr[ée]e|plat|fromages?|dessert)\s*[:\-–]\s*/i);

    const d = VIG.detecterAliments(l);
    return {nom: l, temps: temps || VIG.devinerTemps(d.tags, l), tags: d.tags, aliments: d.aliments.map(a => ({nom: a.nom, tags: a.tags}))};

  let n = 0;
  for (const l of lignes.slice(avecEntete ? 1 : 0)) { const c = split(l); const o = {}; ordre.forEach((k, i) => { if (k && c[i] != null) o[k] = c[i]; }); if (!o.nom) continue;
    const num = v => { if (v == null || v === "") return null; const x = Number(String(v).replace(",", ".").replace(/[^\d.\-]/g, "")); return isNaN(x) ? null : x; };
    const couleur = coul(o.couleur || "") || VIG.suggestCouleur(o.nom + " " + (o.appellation || "")) || "rouge";
    const r = {id: uid(), nom: o.nom, domaine: o.domaine || "", appellation: o.appellation || "", region: o.region || "", couleur, millesime: num(o.millesime), stock: num(o.stock) || 0, par: num(o.par) || 0, cible: num(o.cible) || 0, prixAchat: num(o.prixAchat), prixVente: num(o.prixVente), zone: zone(o.zone || ""), format: 75, fournisseur: o.fournisseur || "", notes: o.notes || "", lastCount: null, createdAt: nowIso(), archive: false};
    r.famille = (o.famille && VIG.FAM[o.famille]) ? o.famille : VIG.suggestFamille(r.nom + " " + r.appellation, couleur); S.refs.push(r); n++; }
  if (n) { S.meta.demo = false; save(); }
  return n;
}

/* =====================================================================
   ACTIONS, ÉVÉNEMENTS, NAVIGATION, DÉMARRAGE
   ===================================================================== */
let VUE = "today";
function render(v) { v = v || VUE; if (v === "today") renderToday(); else if (v === "cave") renderCave(); else if (v === "accords") renderAccords(); else renderReglages(); majTete(); }
function majTete() {
  $("#who-name").textContent = S.who; $("#who-av").textContent = initiales(S.who);
  const n = nbAlertes(); const d = $("#dot-today"); d.textContent = n; d.classList.toggle("hidden", !n);
  const c = refsActives().filter(aCompter).length; const dc = $("#dot-cave"); dc.textContent = c; dc.classList.toggle("hidden", !c);
  $("#fab").classList.toggle("hidden", VUE !== "cave");
}
function go(v) { VUE = v; $$(".view").forEach(x => x.classList.toggle("on", x.id === "view-" + v)); $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === v)); render(v); window.scrollTo({top: 0}); }
function animerStock(id) { const b = document.querySelector(`.bottle[data-id="${id}"] .stock b`); if (b) { b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); } }
function majBoutonCpt() { if (!CPT) return; const r = CPT.file[CPT.i]; const b = $("#sheet-foot .primary"); if (!r || !b) return; const d = CPT.val - (Number(r.stock) || 0); b.textContent = "Confirmer" + (d === 0 ? " (conforme)" : d > 0 ? ` (+${d})` : ` (${d})`); }
function renderCaveListe() { const q = $("#q"); const pos = q ? q.selectionStart : 0; renderCave(); const q2 = $("#q"); if (q2 && q) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} } }
function lireFichier(input, cb) { const f = input.files && input.files[0]; input.value = ""; if (!f) return; const rd = new FileReader(); rd.onload = () => cb(String(rd.result || "")); rd.readAsText(f); }

const ACTIONS = {
  go: el => go(el.dataset.view),
  who: () => openSheet("Qui tient la cave ?", `<div class="chips">${S.team.map(n => `<button class="chip ${n === S.who ? "on" : ""}" data-action="who-set" data-n="${h(n)}">${h(n)}</button>`).join("")}</div><p class="tiny" style="margin-top:10px">Chaque vente, casse ou comptage est signé par la personne active. L'équipe se gère dans Réglages.</p>`),
  "who-set": el => { S.who = el.dataset.n; save(); closeSheet(); render(); toast(`${S.who} tient la cave`); },
  "close-sheet": () => closeSheet(),
  "demo-vider": () => { if (confirm("Supprimer la cave de démonstration (bouteilles, mouvements, tâches) pour commencer la vôtre ?")) { viderCave(); render(); toast("Cave vide. Ajoutez votre première bouteille avec +"); } },
  "demo-reload": () => { if (confirm("Remplacer la cave actuelle par la démonstration ?")) { const s = etatDefaut(); s.settings = S.settings; semerDemo(s); S = s; save(); render(); toast("Démo rechargée"); } },
  "vider-cave": () => { if (confirm("Vider toute la cave ? Pensez à exporter un JSON avant.")) { viderCave(); render(); toast("Cave vidée"); } },
  "count-start": el => ouvrirComptage(el.dataset.zone || null),
  "count-one": el => ouvrirComptage(null, [el.dataset.id]),
  "cpt-step": el => { CPT.val = Math.max(0, CPT.val + Number(el.dataset.d)); const v = $("#cpt-val"); v.textContent = CPT.val; v.classList.remove("pop"); void v.offsetWidth; v.classList.add("pop"); $("#cpt-input").value = CPT.val; vibre(8); majBoutonCpt(); },
  "cpt-skip": () => { CPT.i++; renderComptage(); },
  "cpt-ok": () => { const r = CPT.file[CPT.i]; const v = Math.max(0, Math.round(Number($("#cpt-input").value) || 0)); compter(r.id, v); CPT.faits++; CPT.i++; vibre(12); if (CPT) renderComptage(); },
  "task-toggle": el => { const k = el.dataset.k; if (el.dataset.manuel === "1") { const t = S.tasks.find(x => x.id === k); if (t) { t.done = !t.done; t.doneAt = t.done ? nowIso() : null; } } else { if (S.autoDone[k] === today()) delete S.autoDone[k]; else S.autoDone[k] = today(); } save(); vibre(8); render(); },
  filt: el => { const f = el.dataset.f, v = el.dataset.v; F[f] = (f === "only" && F.only === v) ? "" : v; renderCave(); },
  mvt: el => { const r = refById(el.dataset.id); if (!r) return; const q = Number(el.dataset.qty); if (q < 0 && (Number(r.stock) || 0) <= 0) { toast("Déjà à zéro"); return; } mouvement(r.id, el.dataset.type, q); vibre(8); toast(`${TYPES_MVT[el.dataset.type][0]} · ${r.nom} → ${r.stock}`); if (sheetCtx === "ref") ouvrirRef(r.id); render(); animerStock(r.id); },
  "mvt-qty": el => { const r = refById(el.dataset.id); const type = el.dataset.type; openSheet(`${TYPES_MVT[type][0]} · ${r.nom}`, `<div class="card flat" style="text-align:center"><div class="tiny">Combien de bouteilles ?</div><div class="stepper big" style="margin:12px auto"><button data-action="qty-step" data-d="-1" aria-label="Moins">−</button><span class="v" id="qty-val">6</span><button data-action="qty-step" data-d="1" aria-label="Plus">+</button></div><input class="input num" id="qty-input" type="number" inputmode="numeric" min="1" value="6" style="max-width:140px;margin:0 auto;text-align:center"></div>`, `<button class="btn ghost" data-action="ref-open" data-id="${r.id}">Annuler</button><button class="btn primary grow" data-action="qty-ok" data-id="${r.id}" data-type="${type}">Valider</button>`); },
  "qty-step": el => { const i = $("#qty-input"); i.value = Math.max(1, (Number(i.value) || 0) + Number(el.dataset.d)); $("#qty-val").textContent = i.value; },
  "qty-ok": el => { const q = Math.max(1, Math.round(Number($("#qty-input").value) || 1)); const r = refById(el.dataset.id); mouvement(r.id, el.dataset.type, q); toast(`+${q} · ${r.nom} → ${r.stock}`); ouvrirRef(r.id); render(); },
  "ref-open": el => ouvrirRef(el.dataset.id),
  "ref-edit": el => ouvrirFiche(el.dataset.id),
  "add-ref": () => ouvrirFiche(null),
  "ref-archive": el => { const r = refById(el.dataset.id); if (r && confirm(`Archiver « ${r.nom} » ? La référence sort de la cave, l'historique reste.`)) { r.archive = true; save(); closeSheet(); render(); toast("Archivée"); } },
  "ref-submit": () => { const f = $("#f-ref"); const o = lireFiche(); if (!o) return; const id = f.dataset.id;
    if (id) { const r = refById(id); const avant = Number(r.stock) || 0; Object.assign(r, o); if (o.stock !== avant) { r.stock = avant; mouvement(id, "correction", o.stock - avant, "corrigé dans la fiche"); } }
    else S.refs.push(Object.assign({id: uid(), createdAt: nowIso(), lastCount: null, archive: false}, o));
    save(); closeSheet(); render(); toast(id ? "Fiche enregistrée" : `${o.nom} ajouté à la cave`); majBadges(); },
  seg: el => { const f = $("#f-ref"); if (!f) return; el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el)); f[el.dataset.name].value = el.dataset.v; if (el.dataset.name === "couleur") majHintFamille(); },
  "scan-etiquette": () => demanderImage("etiquette"),
  "scan-plat": () => demanderImage("plat"),
  "img-cam": () => $("#f-cam").click(),
  "img-lib": () => $("#f-lib").click(),
  "focus-plats": () => { const t = $("#plats"); t.focus(); t.scrollIntoView({behavior: "smooth", block: "center"}); },
  "ex-plat": el => { $("#plats").value = EXEMPLES[Number(el.dataset.i)]; lancerAccords(); },
  "accords-go": () => lancerAccords(),
  "acc-save": () => sauverAccord(),
  "acc-clear": () => { ACC.plats = []; ACC.photo = null; ACC.erreur = ""; ACC.texte = ""; ACC.notesIA = ""; renderAccords(); },
  "acc-open": el => { const a = S.accords.find(x => x.id === el.dataset.id); if (!a) return; ACC.plats = a.plats.map(p => Object.assign({}, p)); ACC.texte = a.texte; ACC.photo = null; ACC.erreur = ""; ACC.notesIA = ""; renderAccords(); $("#acc-result").scrollIntoView({behavior: "smooth"}); },
  "team-del": (el, e) => { e.stopPropagation(); const n = el.dataset.n; if (S.team.length <= 1) { toast("Il faut au moins une personne"); return; } S.team = S.team.filter(x => x !== n); if (S.who === n) S.who = S.team[0]; save(); render(); },
  theme: el => { S.settings.theme = el.dataset.v; save(); applyTheme(); renderReglages(); },
  "export-json": () => telecharger(`vignolo-${today()}.json`, JSON.stringify(S, null, 1), "application/json"),
  "import-json": () => $("#f-json").click(),
  "export-csv": () => exporterCSV(),
  "import-csv": () => $("#f-csv").click(),
};

document.addEventListener("click", e => { const el = e.target.closest("[data-action]"); if (!el) return; const fn = ACTIONS[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); } });
$("#veil").addEventListener("click", closeSheet);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.addEventListener("submit", e => { const f = e.target.closest("[data-form]"); if (!f) return; e.preventDefault(); const k = f.dataset.form;
  if (k === "task-add") { const t = f.titre.value.trim(); if (!t) return; S.tasks.push({id: uid(), titre: t, done: false, createdAt: nowIso(), due: null}); save(); render(); toast("Tâche ajoutée"); }
  else if (k === "team-add") { const n = f.n.value.trim(); if (!n || S.team.includes(n)) return; S.team.push(n); save(); render(); }
  else if (k === "ref-save") ACTIONS["ref-submit"](); });
document.addEventListener("input", e => { const t = e.target;
  if (t.id === "q") { F.q = t.value; renderCaveListe(); }
  else if (t.id === "cpt-input" && CPT) { CPT.val = Math.max(0, Number(t.value) || 0); $("#cpt-val").textContent = CPT.val; majBoutonCpt(); }
  else if (t.id === "qty-input") $("#qty-val").textContent = t.value;
  else if (t.form && t.form.id === "f-ref" && (t.name === "nom" || t.name === "appellation")) majHintFamille(); });
document.addEventListener("change", e => { const t = e.target; const k = t.dataset.change;
  if (!k) {
    if (t.id === "f-cam" || t.id === "f-lib") { const f = t.files && t.files[0]; t.value = ""; traiterImage(f); }
    else if (t.id === "f-json") lireFichier(t, txt => { try { const j = JSON.parse(txt); if (!j || !Array.isArray(j.refs)) throw 0; if (!confirm(`Restaurer cette sauvegarde (${j.refs.length} références) à la place de la cave actuelle ?`)) return; S = Object.assign(etatDefaut(), j, {settings: Object.assign(etatDefaut().settings, j.settings || {})}); save(); applyTheme(); render(); toast("Sauvegarde restaurée"); } catch (x) { toast("Fichier JSON invalide"); } });
    else if (t.id === "f-csv") lireFichier(t, txt => { if (S.meta.demo && S.refs.length && confirm("Retirer la cave de démonstration avant d'importer ?")) viderCave(); const n = importerCSV(txt); toast(n ? `${plur(n, "référence importée", "références importées")}` : "Aucune ligne lisible"); go("cave"); });
    else if (t.form && t.form.id === "f-ref" && t.name === "famille") majHintFamille();
    return; }
  if (k === "temps") { ACC.plats[Number(t.dataset.i)].temps = t.value; $("#acc-result").innerHTML = renderResultat(); }
  else if (k === "rythme") { S.settings.rythme = S.settings.rythme || {}; S.settings.rythme[t.dataset.z] = Math.max(1, Number(t.value) || 7); save(); majTete(); }
  else if (k === "tolerance") { S.settings.tolerance = Math.max(0, Number(t.value) || 0); save(); }
  else if (k === "apiKey" || k === "model" || k === "effort") { S.settings[k] = String(t.value).trim(); save(); toast("Réglage enregistré"); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });

/* ---------- Démarrage ---------- */
applyTheme(); go("today"); majBadges(); save();   /* la cave du premier lancement est gardée telle quelle, d'une ouverture à l'autre */
if (S.meta.demoMaj) { const m = S.meta.demoMaj; delete S.meta.demoMaj; save(); setTimeout(() => toast(m === "auto" ? `Cave de démonstration mise à jour : ${S.refs.length} références` : "Nouvelle démo disponible : Réglages › Recharger la démo"), 600); }
try { if (STOCKAGE_OK && "serviceWorker" in navigator && isSecureContext && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(() => {}); } catch (e) {}
</script>
